[workspace]
members = ["crates/mf-engine", "crates/mf-ui", "crates/tree-sitter-skript"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mf-engine = { path = "crates/mf-engine" }
mf-ui = { path = "crates/mf-ui" }
tree-sitter-skript = { path = "crates/tree-sitter-skript" }

anyhow = "1.0"
thiserror = "2.0"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"

[package]
name = "meshflow"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multi-agent AI workstation"

[dependencies]
mf-engine.workspace = true
mf-ui.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
